[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arch-web"
dynamic = ["version"]
description = "Framework-neutral web project contracts for ARCH."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "ARCH Web Maintainers" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["arch-runtime>=0.1.0,<0.2.0"]

[dependency-groups]
dev = [
  "build>=1.2",
  "hypothesis>=6.0",
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
  "twine>=6.0",
]

[tool.uv.sources]
arch-runtime = { git = "https://github.com/erikmktdig-cell/ARCH-runtime.git", tag = "v0.1.0" }
arch-kernel = { git = "https://github.com/erikmktdig-cell/ARCH-kernel.git", tag = "v0.1.0" }

[tool.hatch.version]
path = "src/arch_web/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_web"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/LICENSE", "/README.md", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--basetemp=.pytest-tmp",
  "--cov=arch_web",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
markers = [
  "unit: focused contract tests",
  "property: generative contract tests",
  "architecture: dependency and public-surface tests",
]

[tool.coverage.run]
branch = true
source = ["src/arch_web"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PT", "PTH", "RUF", "SIM", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/arch_web", "tests"]
warn_unused_configs = true
show_error_codes = true
pretty = true
